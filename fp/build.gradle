plugins {
    id 'java-library'
}

// ScalarWide-FP: high-precision binary floating point (correctly rounded).
// Depends on the root project by source, so core changes are immediately visible here.
group = 'com.scalarwide'
version = rootProject.file('VERSION').text.trim()

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

sourceSets {
    jmh {
        java.srcDirs = ['src/jmh/java']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    jmhImplementation.extendsFrom implementation
    jmhRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation project(':')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
}

tasks.register('jmhJar', Jar) {
    archiveClassifier = 'jmh'
    from sourceSets.jmh.output
    from sourceSets.main.output
    from { configurations.jmhRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'org.openjdk.jmh.Main'
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
