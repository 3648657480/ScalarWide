plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.scalarwide'
version = file('VERSION').text.trim()

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    // 同场景对照（2026-11-06）：Long2 Int256/Int1024——列累加内核，固定宽度同映射
    maven { url 'https://axorbisinfinitive.github.io/Long2/maven/' }
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

sourceSets {
    jmh {
        java.srcDirs = ['src/jmh/java']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    jmhImplementation.extendsFrom implementation
    jmhRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'org.openjdk.jol:jol-core:0.17'

    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    // 同场景对照（issue #1）：定宽 limb 算术加速库（BouncyCastle math.raw.Nat*）
    jmhImplementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    // 同场景对照（2026-11-06）：Long2（com.inf.long2:Long2）——Int256/512/1024。
    // 该库产物是 Java 25 字节码，故 jmh 源集单独用 release 25（库本体仍是 release 21）。
    jmhImplementation 'com.inf.long2:Long2:0.1.8'
}

test {
    useJUnitPlatform()
    maxHeapSize = '2G'
}

tasks.named('compileJmhJava') {
    options.annotationProcessorPath = configurations.jmhAnnotationProcessor
    // Long2 的产物是 Java 25 字节码；基准源集需要能引用它。库本体（main）仍为 release 21。
    options.release = 25
}

tasks.register('jmh', JavaExec) {
    group = 'benchmark'
    description = 'Run JMH benchmarks, e.g. gradlew jmh --args="com.scalarwide.bench.Wide128Bench -wi 3 -i 5 -f 1"'
    dependsOn tasks.named('jmhClasses')
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
}

tasks.register('layout', JavaExec) {
    group = 'verification'
    description = 'Prints JOL object layouts for all widths.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.scalarwide.LayoutReport'
}

tasks.register('genMul', JavaExec) {
    group = 'verification'
    description = 'Generates fully unrolled mul/mulHigh bodies into build/gen/'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.scalarwide.GenMul'
}

tasks.register('jmhJar', Jar) {
    group = 'benchmark'
    description = 'Build a self-contained JMH runner jar.'
    dependsOn tasks.named('jmhClasses')
    archiveClassifier = 'jmh'
    from sourceSets.jmh.output
    from sourceSets.main.output
    from({
        configurations.jmhRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        // bcprov 等依赖带签名；fat jar 必须去掉签名文件，否则
        // "Invalid signature file digest for Manifest main attributes"
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'org.openjdk.jmh.Main'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'scalarwide'
        }
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'ScalarWide',
                'Implementation-Version': version
        )
    }
    // Ship the licence inside the artifact: the mc line is `include`d into downstream
    // mod jars, so a jar without a licence file propagates that gap to consumers.
    from('LICENSE.txt') {
        into 'META-INF'
    }
}
